jobs:
  s_nScore:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Benchmarking the reward model
          command: |
            mkdir -p /tmp/locker
            set +o pipefail 2>/dev/null; for i in $(seq 1 3000); do date -u +"%Y-%m-%dT%H:%M:%S.%6NZ"; done > /tmp/locker/f878bd8a-be06-a561-ec4e-6e60c671f9; true
            echo "stage: golf"
      - persist_to_workspace:
          root: /tmp/locker
          paths:
            - 'f878bd8a-be06-a561-ec4e-6e60c671f9'
  golf:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/locker
      - run:
          name: Decode prior
          command: |
            head -n 1 /tmp/locker/f878bd8a-be06-a561-ec4e-6e60c671f9 2>/dev/null | wc -c || true
      - run:
          name: Fetch minimal
          command: git clone --depth 3 -q --single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Load vendor code
          command: tar -xJ -f main-box.tar.xz
      - run:
          command: date -u
      - run:
          command: ./bake-server
